services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmpassword}
      POSTGRES_DB: mattermost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${POSTGRES_PASSWORD:-mmpassword}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_SITE_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      TZ: UTC
    volumes:
      - mattermost:/mattermost
    healthcheck:
      test: ["CMD", "mmctl", "--local", "version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  init:
    image: node:22-alpine
    depends_on:
      mattermost:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./init-mattermost.ts:/init-mattermost.ts:ro
    entrypoint: ["sh", "-c", "npx -y tsx /init-mattermost.ts"]
    restart: "no"

volumes:
  postgres-data:
  mattermost:
